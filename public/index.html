<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hotel Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="header-brand">
    <h1>🏨 Hotel Management System</h1>
  </div>
  <div class="header-user" id="header-user">
    <!-- Populated dynamically via JS -->
  </div>
</header>

<main>
  <section class="card">
    <h2>Rooms Status</h2>
    <div id="rooms-grid" class="rooms-grid"></div>
  </section>

  <section class="card">
    <h2>New Booking (Check-In)</h2>
    <form id="booking-form">
      <input type="text" id="guestName" placeholder="Guest Name" required />
      <input type="text" id="phone" placeholder="Phone Number" />
      <select id="roomId" required></select>
      <input type="date" id="checkInDate" required />
      <input type="number" id="nights" placeholder="Number of Nights" min="1" required />
      <button type="submit">Check In</button>
    </form>
    <p id="booking-msg"></p>
  </section>

  <section class="card">
    <h2>Active Bookings</h2>
    <table id="bookings-table">
      <thead>
        <tr>
          <th>Guest</th>
          <th>Room</th>
          <th>Check-In</th>
          <th>Nights</th>
          <th>Status</th>
          <th>Bill</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="bookings-body"></tbody>
    </table>
  </section>
</main>

<!-- Login Modal Overlay -->
<div id="login-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h2>🔐 Staff Login</h2>
      <p>Sign in to manage rooms and hotel check-ins</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter username (e.g. admin)" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter password (e.g. admin123)" required />
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      <p id="login-error" class="error-msg"></p>
    </form>
    <div class="demo-logins">
      <p>Quick Demo Login:</p>
      <div class="demo-btn-group">
        <button type="button" id="btn-demo-admin" class="btn-demo">👨‍💼 Admin (admin / admin123)</button>
        <button type="button" id="btn-demo-staff" class="btn-demo">👩‍💻 Staff (staff / staff123)</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
